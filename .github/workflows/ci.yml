# News Reader – test pipeline
#
#   php     lint (incl. deprecations) + unit tests + API tests on PHP 8.5 (the minimum and only supported version),
#           plus one run without ext-curl (stream-wrapper fallback in src/http.php)
#   static  JS unit tests, i18n checks, "generated language pages are up to date"
#   e2e     Playwright: app + site in Chromium (desktop + mobile), incl. two-device sync and offline mode
#
# Everything runs offline against a local fixture server (tests/fixtures/) – no real website is contacted.
# Run locally: npm ci && npx playwright install chromium && npm test

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'  # minimum supported version – keep in sync with README, api/index.php and i18n/*.json

jobs:
  php:
    name: PHP${{ matrix.curl == false && ' (no curl)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        curl: [true, false]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, libxml, mbstring, openssl, zlib, ${{ matrix.curl && 'curl' || ':curl' }}
          ini-values: error_reporting=E_ALL, allow_url_fopen=On
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint (php -l, deprecations are errors)
        run: |
          # php -l exits 0 on compile-time deprecations – fail on any diagnostic it prints
          out=$(find . -name '*.php' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 php -l -d display_errors=1 -d error_reporting=-1 2>&1) || { echo "$out"; exit 1; }
          if grep -E '^(PHP )?(Deprecated|Warning|Notice|Fatal|Parse)' <<<"$out"; then exit 1; fi
          echo "$out" | wc -l | xargs echo "files OK:"

      - name: Unit tests
        run: php tests/php/run.php

      - name: Platform rules
        run: php tests/feed-rules-test.php

      - name: API tests (Collector, articles, sync, security)
        run: node --test --test-reporter=spec "tests/api/*.test.mjs"

  static:
    name: JS, i18n & generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, libxml, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JS unit tests (syntax, feeds, i18n, assets)
        run: node --test --test-reporter=spec "tests/js/*.test.mjs"

      - name: Language pages are up to date (tools/build-i18n.php)
        run: |
          php tools/build-i18n.php --site=https://news-reader.app/
          # <lastmod> carries the build date – everything else must be committed as generated
          if ! git diff --exit-code -I '<lastmod>' -- index.html privacy.html imprint.html thanks.html de fr it es app/index.html docs/api/index.html sitemap.xml; then
            echo "::error::Generated language pages are outdated – run: php tools/build-i18n.php --site=https://news-reader.app/"
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, libxml, mbstring, curl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
