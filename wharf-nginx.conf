# FeedForge nginx config for Wharf.
# Paste this into feedforge's own nginx config in Wharf (keep every {{…}}).
#
#   http(s)://feedforge.localhost/api/?url=<url-encoded URL>

server {
  {{listen}}
  {{ssl}}
  server_name {{server_name}};
  root "{{root}}";
  index index.php index.html;

  access_log "{{log_dir}}/access.log";
  error_log "{{log_dir}}/error.log";

  charset utf-8;
  client_max_body_size 1m;

  # Internals are never web-accessible: code, cache, config, dotfiles
  location ~ ^/(src|var)(/|$)   { deny all; return 404; }
  location ~ /\.                { deny all; return 404; }
  location ~ \.(conf|md|lock)$  { deny all; return 404; }

  # Root: redirect to the API usage info
  location = / { return 302 /api/; }

  # API: /api/  and  /api  both hit api/index.php
  location = /api { return 301 /api/$is_args$args; }
  location /api/ {
    try_files $uri /api/index.php$is_args$args;
  }

  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass {{php}};
    include "{{fastcgi}}";
    fastcgi_read_timeout 120s;   # first resolve may probe several URLs
  }
}
