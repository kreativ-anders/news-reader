<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- WARNING: changing the inline script below requires a new sha256 hash in this CSP.
       It also moves pairing keys (#pair=) and shared URLs (?add=) out of the address bar (history, screenshots) before anything else runs.
       The app loads no analytics – keep it that way (reading data and keys must never leave the device unencrypted). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-mHRy6EVvqhJi9IKXuNfPkqhcE0I5A9ptIcrOV/LxRZQ='; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https: http:; connect-src 'self' https:; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <script>try{var t=localStorage.getItem("nr.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}var l=location,p=/(^|&)pair=/.test(l.hash.slice(1));if(l.search||p){window.nrIncoming={search:l.search,hash:l.hash};history.replaceState(null,"",l.pathname+(p?"":l.hash))}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>News</title>
  <meta name="description" content="News is a calm, local-first RSS reader: every entry gets one decision – read now, later or not interested. Encrypted sync, no account.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://news-reader.app/app/">
  <meta name="theme-color" content="#292929" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icons/favicon-32-dark.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/source-sans-3.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view" data-i18n="app.skip">Skip to content</a>

  <header class="top">
    <a class="brand" href="./" aria-label="News – Inbox" data-i18n-attr="aria-label:app.home">
      <svg class="nr-mark" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="i" x="8" y="8" width="48" height="48" rx="6" stroke-width="4"/><rect class="f" x="16" y="16" width="32" height="7" rx="1.5"/><path class="i" d="M40.5 30.5H46.5M40.5 38.5H46.5M40.5 46.5H43.5" stroke-width="3"/><path class="r" d="M19 37.5A7.5 7.5 0 0 1 26.5 45M19 31A14 14 0 0 1 33 45" stroke-width="4"/><circle class="d" cx="19" cy="45" r="3"/></svg>
      <span>News <small data-i18n="app.tagline">News Reader</small></span>
    </a>
    <div class="top-actions">
      <button id="searchBtn" class="icon-btn" type="button" title="Search and go to (/)" aria-label="Search and go to" data-i18n-attr="title:app.search;aria-label:app.search_label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button id="syncPill" class="sync" type="button" data-state="local" title="Sync status – click to sync now">
        <span class="ico" aria-hidden="true"></span><span class="txt">Local only</span>
      </button>
      <button id="refreshBtn" class="icon-btn" type="button" title="Refresh feeds (r)" aria-label="Refresh feeds" data-i18n-attr="title:app.refresh;aria-label:app.refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" type="button" data-view="settings" title="Settings" aria-label="Settings" data-i18n-attr="title:app.settings;aria-label:app.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="nav" aria-label="Views" data-i18n-attr="aria-label:app.views">
      <button type="button" data-view="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg><span data-i18n="nav.inbox">Inbox</span><b class="badge" data-count="inbox"></b></button>
      <button type="button" data-view="reading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span data-i18n="nav.reading">Read now</span><b class="badge" data-count="reading"></b></button>
      <button type="button" data-view="later"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span data-i18n="nav.later">Later</span><b class="badge" data-count="later"></b></button>
      <button type="button" data-view="done"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="nav.done">Done</span></button>
      <button type="button" data-view="feeds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5"/></svg><span data-i18n="nav.feeds">Feeds</span></button>
      <section class="nav-sec" id="srcSec" hidden>
        <button type="button" class="nav-h" id="feedNavToggle" aria-expanded="true" aria-controls="feedNav" title="Show/hide sources" data-i18n-attr="title:nav.toggle_feeds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><span data-i18n="nav.sources">Sources</span></button>
        <div class="subnav" id="feedNav"></div>
      </section>
    </nav>
    <main id="view" tabindex="-1"></main>
    <!-- INFO: outside #view – a redraw while the file picker is open would detach it and lose the chosen file -->
    <input type="file" id="opmlIn" accept=".opml,.xml,text/xml,application/xml" hidden>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dlg" aria-labelledby="dlgTitle">
    <form method="dialog">
      <h2 id="dlgTitle"></h2>
      <div id="dlgBody"></div>
      <div class="dlg-actions">
        <button value="cancel" class="btn btn-ghost" id="dlgCancel">Cancel</button>
        <button value="ok" class="btn btn-primary" id="dlgOk">OK</button>
      </div>
    </form>
  </dialog>

  <dialog id="palette" class="palette" aria-label="Search and go to" data-i18n-attr="aria-label:app.search_label">
    <input id="palIn" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" placeholder="Search posts, feeds and views" data-i18n-attr="placeholder:pal.placeholder;aria-label:app.search_label">
    <ul id="palList" role="listbox" aria-label="Results" data-i18n-attr="aria-label:pal.results"></ul>
    <p id="palStatus" class="sr" role="status"></p>
    <p class="pal-hint" data-i18n="pal.hint"><kbd>↑</kbd><kbd>↓</kbd> choose · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</p>
  </dialog>

  <noscript><p class="empty"><strong>News needs JavaScript.</strong>A calm, local-first RSS reader: every entry gets one decision – read now, later or not interested. Encrypted sync, no account. <a href="../">About News Reader</a></p></noscript>
</body>
</html>
